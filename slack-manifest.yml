# Create the app at https://api.slack.com/apps -> "Create New App" -> "From a manifest"
display_information:
  name: ShipGate
  description: Deploy approvals for CI/CD pipelines
  background_color: "#1f6f43"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: ShipGate
    always_online: true
  slash_commands:
    - command: /shipgate
      description: Deploy approval history and status
      usage_hint: "history [n] | status <id>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - usergroups:read
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
