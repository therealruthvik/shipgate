name: Deploy (demo)

# Demo pipeline: build -> Slack approval gate -> deploy -> report result to Slack.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      notes:
        description: Notes for approvers
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - run: echo "Building image..." && sleep 2

  approve:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      request-id: ${{ steps.gate.outputs.request-id }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./  # other repos: uses: <owner>/shipgate@v1
        with:
          shipgate-url: ${{ secrets.SHIPGATE_URL }}
          api-token: ${{ secrets.SHIPGATE_API_TOKEN }}
          service: demo-api
          environment: ${{ inputs.environment }}
          version: ${{ needs.build.outputs.version }}
          requester-slack-id: ${{ vars.SLACK_ID_MAP && fromJSON(vars.SLACK_ID_MAP)[github.actor] || '' }}
          description: ${{ inputs.notes }}

  deploy:
    needs: [build, approve]
    runs-on: ubuntu-latest
    env:
      SHIPGATE_URL: ${{ secrets.SHIPGATE_URL }}
      SHIPGATE_API_TOKEN: ${{ secrets.SHIPGATE_API_TOKEN }}
      REQUEST_ID: ${{ needs.approve.outputs.request-id }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/shipgate_gate.py event --id "$REQUEST_ID" --event started
      - name: Deploy
        run: echo "Deploying ${{ needs.build.outputs.version }} to ${{ inputs.environment }}..." && sleep 5
      - if: success()
        run: python3 scripts/shipgate_gate.py event --id "$REQUEST_ID" --event succeeded --details "Run ${{ github.run_number }}"
      - if: failure()
        run: python3 scripts/shipgate_gate.py event --id "$REQUEST_ID" --event failed --details "Check the run logs"
