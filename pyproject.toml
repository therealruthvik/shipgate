[project]
name = "shipgate"
version = "0.1.0"
description = "Slack-based deploy approval gate for CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18",
    "slack-sdk>=3.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
shipgate = "shipgate.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shipgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
